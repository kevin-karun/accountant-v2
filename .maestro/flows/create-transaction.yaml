appId: host.exp.exponent
---
- tapOn:
    id: "tab-dev-tools"
- assertVisible: "Dev Tools"
- tapOn: "dev-create-smoke-transaction"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Smoke expense created successfully"
    commands:
      - assertVisible: "Smoke expense created successfully"

- runFlow:
    when:
      visible: "Smoke expense already exists"
    commands:
      - assertVisible: "Smoke expense already exists"
- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
- waitForAnimationToEnd
- assertVisible:
    id: "transaction-row-smoke-expense"
