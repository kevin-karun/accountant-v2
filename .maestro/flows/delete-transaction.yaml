appId: host.exp.exponent
---
- tapOn:
    id: "tab-dev-tools"
- assertVisible: "Dev Tools"
- tapOn: "dev-delete-smoke-transaction"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Smoke transaction deleted successfully"
    commands:
      - assertVisible: "Smoke transaction deleted successfully"

- runFlow:
    when:
      visible: "Smoke transaction already deleted"
    commands:
      - assertVisible: "Smoke transaction already deleted"

- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
- assertNotVisible:
    id: "transaction-row-smoke-expense-updated"
- assertNotVisible:
    id: "transaction-row-smoke-expense"

- tapOn:
    id: "tab-dashboard"
- assertVisible: "Dashboard"
- assertNotVisible:
    id: "dashboard-recent-row-smoke-expense-updated"
