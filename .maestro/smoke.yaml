appId: host.exp.Exponent
---
- launchApp
- runFlow:
    when:
      visible: "app"
    commands:
      - tapOn: "app"
- assertVisible: "Dashboard"
- tapOn:
    id: "tab-accounts"
- assertVisible: "Accounts"
- runFlow:
    when:
      visible: "New Account"
    commands:
      - tapOn: "New Account"
- assertVisible: "Create New Account"
- tapOn: "create-smoke-account"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Smoke account created successfully"
    commands:
      - assertVisible: "Smoke account created successfully"

- runFlow:
    when:
      visible: "Smoke account already exists"
    commands:
      - assertVisible: "Smoke account already exists"

- tapOn:
    id: "tab-add"
- assertVisible: "Add Transaction"
- tapOn: "create-smoke-expense"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Smoke expense created successfully"
    commands:
      - assertVisible: "Smoke expense created successfully"

- runFlow:
    when:
      visible: "Smoke expense already exists"
    commands:
      - assertVisible: "Smoke expense already exists"
- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
- waitForAnimationToEnd
- assertVisible:
    id: "transaction-row-smoke-expense"

- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
- tapOn:
    id: "transaction-row-smoke-expense"
- assertVisible: "Edit Transaction"
- tapOn: "apply-smoke-transaction-update"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Smoke expense updated successfully"
    commands:
      - assertVisible: "Smoke expense updated successfully"

- runFlow:
    when:
      visible: "Smoke expense already updated"
    commands:
      - assertVisible: "Smoke expense already updated"

- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
- assertVisible:
    id: "transaction-row-smoke-expense-updated"

- tapOn:
    id: "tab-dashboard"
- assertVisible: "Dashboard"
- assertVisible:
    id: "dashboard-recent-row-smoke-expense-updated"

- tapOn:
    id: "dashboard-recent-row-smoke-expense-updated"
- assertVisible: "Edit Transaction"
- scrollUntilVisible:
    element:
      id: "edit-transaction-delete"
    direction: DOWN
- assertVisible:
    id: "edit-transaction-delete"
- tapOn:
    id: "edit-transaction-delete"
- tapOn: "Delete"
- assertVisible: "Dashboard"

- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
- assertNotVisible: "Smoke expense updated"

- tapOn:
    id: "tab-dashboard"
- assertVisible: "Dashboard"
- tapOn:
    id: "tab-accounts"
- assertVisible: "Accounts"
- tapOn:
    id: "tab-transactions"
- assertVisible: "Transactions"
